<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>人生日历</title>
<link href="https://fonts.googleapis.com/css2?family=Playpen+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-LJ7JWER07V"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-LJ7JWER07V');
</script>
<style>
  /* 保证 Logo 与标题同行，响应式折行 */
  .logo-title-wrapper {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 0.5rem;
  }
  .logo-svg {
    flex-shrink: 0;
    line-height: 1;
  }
  .logo-svg svg {
    display: block;
    width: 48px;
    height: auto;
  }
  /* 原 h1 样式保留，只移除多余的 margin */
  .logo-title-wrapper h1 {
    margin: 0;
  }
  /* 移动端微调 */
  @media (max-width: 480px) {
    .logo-svg svg {
      width: 40px;
    }
    .logo-title-wrapper {
      gap: 8px;
    }
  }
</style>
</head>
<body>
<select class="lang-sel" id="langSel"></select>
<div class="input-page" id="inputPage">
  <canvas id="bgCanvas"></canvas>
  <div class="input-card">
    <!-- 品牌 Logo + 标题 并排显示 -->
    <div class="logo-title-wrapper">
      <div class="logo-svg">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <filter id="gridShadow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="3" dy="3.5" stdDeviation="3.5" flood-color="#7f6240" flood-opacity="0.16"/>
            </filter>
          </defs>
          <rect x="10" y="10" width="80" height="80" rx="18" ry="18" fill="#FEFCF8" stroke="#D4C4A8" stroke-width="1.8" filter="url(#gridShadow)"/>
          <!-- 第1行 -->
          <rect x="20" y="20" width="12" height="12" rx="3" fill="#D4956B" fill-opacity="0.9"/>
          <rect x="36" y="20" width="12" height="12" rx="3" fill="#E8DCC8" fill-opacity="0.6"/>
          <rect x="52" y="20" width="12" height="12" rx="3" fill="#E8DCC8" fill-opacity="0.4"/>
          <rect x="68" y="20" width="12" height="12" rx="3" fill="#D4956B" fill-opacity="0.3"/>
          <!-- 第2行 -->
          <rect x="20" y="36" width="12" height="12" rx="3" fill="#E8DCC8" fill-opacity="0.7"/>
          <rect x="36" y="36" width="12" height="12" rx="3" fill="#D4956B" fill-opacity="0.7"/>
          <rect x="52" y="36" width="12" height="12" rx="3" fill="#D4956B" fill-opacity="0.55"/>
          <rect x="68" y="36" width="12" height="12" rx="3" fill="#E8DCC8" fill-opacity="0.5"/>
          <!-- 第3行 -->
          <rect x="20" y="52" width="12" height="12" rx="3" fill="#FFDCB5" fill-opacity="0.9" stroke="#D4956B" stroke-width="0.8"/>
          <rect x="36" y="52" width="12" height="12" rx="3" fill="#E8DCC8" fill-opacity="0.5"/>
          <rect x="52" y="52" width="12" height="12" rx="3" fill="#D4956B" fill-opacity="0.85"/>
          <rect x="68" y="52" width="12" height="12" rx="3" fill="#FEFCF8" stroke="#E0D0B8" stroke-width="0.8"/>
          <!-- 第4行 -->
          <rect x="20" y="68" width="12" height="12" rx="3" fill="#D4956B" fill-opacity="0.4"/>
          <rect x="36" y="68" width="12" height="12" rx="3" fill="#E8DCC8" fill-opacity="0.8"/>
          <rect x="52" y="68" width="12" height="12" rx="3" fill="#E8DCC8" fill-opacity="0.3"/>
          <rect x="68" y="68" width="12" height="12" rx="3" fill="#D4956B" fill-opacity="0.6"/>
          <!-- 点缀小圆点 -->
          <circle cx="29" cy="59" r="2.2" fill="#D4956B" fill-opacity="0.9"/>
          <circle cx="77" cy="27" r="1.8" fill="#D4956B" fill-opacity="0.7"/>
        </svg>
      </div>
      <h1 id="cTitle"></h1>
    </div>
    <p id="cSub"></p>
    <label id="lName"></label>
    <input id="inName" placeholder="">
    <label id="lBirth"></label>
    <div class="life-row date-row">
      <select id="inBirthY"></select>
      <select id="inBirthM"></select>
      <select id="inBirthD"></select>
    </div>
    <label id="lLife"></label>
    <div class="life-row">
      <input id="inLife" type="number" min="1" max="120" value="80">
      <span id="unitY"></span>
    </div>
    <div class="age-hint" id="ageHint"></div>
    <button class="btn-go" id="btnGo"></button>
  </div>
</div>
<canvas id="calCanvas"></canvas>
<div class="zoom-hint" id="zoomHint"></div>

<div class="controls" id="controls">
  <button class="ctrl-btn" id="btnReset"></button>
  <button class="ctrl-btn" id="btnThisYear"></button>
  <button class="ctrl-btn" id="btnThisMonth"></button>
  <button class="ctrl-btn accent" id="btnToday"></button>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box" id="modalBox"></div>
</div>
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <p id="confirmMsg"></p>
    <div class="btn-row" style="justify-content:center">
      <button class="hand-btn primary" id="confirmYes"></button>
      <button class="hand-btn" id="confirmNo"></button>
    </div>
  </div>
</div>

<div class="sidebar-overlay" id="sidebarOverlay">
  <button class="sidebar-drag-handle" id="sidebarDragHandle">
    <span class="drag-arrows">
      <svg width="32" height="56" viewBox="0 0 32 56" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polygon points="15,16 15,40 6,28" fill="#8b7d6b"/>
        <polygon points="17,16 17,40 26,28" fill="#8b7d6b"/>
      </svg>
    </span>
  </button>
  <span class="sidebar-close" id="sidebarClose">✕</span>
  <div class="sidebar-header" id="sidebarHeader"></div>
  
  <div class="resizable-container" id="resizableContainer">
    <div class="timeline-container" id="timelineContainer">
      <div class="sidebar-fixed-part" id="sidebarFixedPart"></div>
      <div class="sidebar-scroll-part" id="sidebarScrollPart"></div>
    </div>
    
    <div class="split-bar" id="splitBar">
      <div class="split-handle"></div>
    </div>
    
    <div class="todo-container" id="todoContainer">
      <div class="todo-header">
        <h4 id="todoTitle">📋</h4>
      </div>
      <div class="todo-list" id="todoList"></div>
    </div>
  </div>
</div>

<div id="infoPopover">
  <div class="popover-header">
    <div class="popover-title" id="infoPTitle"></div>
    <div class="popover-actions" id="infoActions">
      <span id="infoEditBtn" title="Edit">📝</span>
      <span id="infoDelBtn" title="Delete" style="color:#c06060">🗑</span>
      <span id="infoCloseBtn" title="Close">✕</span>
    </div>
  </div>
  <div class="popover-time" id="infoPTime"></div>
  <div class="popover-location" id="infoPLoc"></div>
  <div class="popover-description" id="infoPDesc"></div>
  <div class="popover-footer">
    <div class="popover-type" id="infoPType"></div>
  </div>
</div>

<div id="ctxMenu">
  <div class="ctx-item" id="ctxEdit"></div>
  <div class="ctx-item danger" id="ctxDel"></div>
</div>

<div class="toolbox-container" id="toolboxContainer">
  <button class="toolbox-btn" id="toolboxBtn">🛠️</button>
  <div class="toolbox-menu" id="toolboxMenu">
    <div class="toolbox-item" id="toolboxExport">
      <span class="toolbox-icon">📤</span>
      <span class="toolbox-label">导出日程</span>
    </div>
    <div class="toolbox-item" id="toolboxImport">
      <span class="toolbox-icon">📥</span>
      <span class="toolbox-label">导入日程</span>
    </div>
    <div class="toolbox-item toolbox-item-danger" id="toolboxLogout">
      <span class="toolbox-icon">🚪</span>
      <span class="toolbox-label">登出</span>
    </div>
  </div>
</div>

<script src="js/state.js"></script>
<script src="js/lang.js"></script>
<script src="js/render.js"></script>
<script src="js/interaction.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/modal.js"></script>
<script src="js/app.js"></script>
</body>
</html>
